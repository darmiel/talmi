# yaml-language-server: $schema=https://talmi.qwer.tz/schema/config.schema.json
#
# Full Talmi bootstrap example (dev), covering every config section.
#
# It is self-contained and passes offline validation:
#     talmi config vet example/talmi.dev.yaml --local
#
# Run it against in-memory stub providers (no real GitHub/Artifactory creds):
#     talmi serve -c example/talmi.dev.yaml --dev --addr :8080
#
# Secrets here use the `raw:` scheme so the tree is runnable as-is. In production
# never inline secrets - use `file:/run/secrets/...` or `env:VAR_NAME`.

# --- Admin session signing -------------------------------------------------
# Talmi signs its own admin session JWTs (issued by `talmi login`).
# ES256 (recommended) expects an EC private key PEM via a secret ref:
#     signing: { algorithm: ES256, key: file:/run/secrets/session.pem }
# HS256 takes a raw shared secret and is fine for local dev.
signing:
  algorithm: HS256
  key: raw:dev-only-session-key-change-me-0123456789

# --- Lease store -----------------------------------------------------------
# Holds issued leases + revocation state. `memory` is ephemeral (lost on
# restart); use `postgres` in production. Migrations must be applied out-of-band.
store:
  type: memory
  # type: postgres
  # dsn: env:TALMI_STORE_DSN

# --- Audit log -------------------------------------------------------------
# Every decision is recorded, including denials.
audit:
  enabled: true
  type: memory          # postgres | memory | noop
  # dsn: env:TALMI_AUDIT_DSN

# --- Admin API -------------------------------------------------------------
# Enables `talmi login`, `talmi audit`, and `talmi tasks`. Names a github-oauth
# issuer for interactive login and a talmi-session issuer for the signed session,
# plus the GitHub device-flow parameters the CLI needs.
auth:
  login_issuer: gh-login
  session_issuer: talmi-session
  session_ttl: 8h
  server: https://github.com
  client_id: Iv1.0000000000000000
  scopes: [ "read:org", "read:user" ]

# --- Rate limiting ---------------------------------------------------------
# Protects the public endpoint. Two token buckets priced by outcome: a clean
# request costs little, an auth failure or heavy operation costs a lot, so abuse
# throttles itself while normal traffic is barely affected. One bucket per
# client IP (edge) and one per verified principal (token path). `memory` keeps
# state per instance; use `redis` to share it across replicas.
rate_limit:
  enabled: true
  backend: memory                     # memory | redis
  # redis:
  #   addr: redis:6379
  #   password: env:REDIS_PASSWORD
  #   db: 0
  # trusted_proxies: [ "10.0.0.0/8" ]   # peers whose X-Forwarded-For we trust
  # bypass_cidrs:    [ "10.1.2.0/24" ]  # internal callers that skip limiting
  ip: { capacity: 60,  refill_per_sec: 1 }
  principal: { capacity: 120, refill_per_sec: 2 }
  # costs:                              # optional per-(category, class) overrides
  #   issue:        { auth_error: 12 }
  #   task_trigger: { success: 10 }

# --- Config source ---------------------------------------------------------
# By default issuers/realms/rules are read from the local include globs below.
# Alternatively, pull them from a GitHub repo pinned to a commit.
#
# SECURITY: only point this at a repository you fully trust, and lock down who
# can write to it (and to the branch/ref you track). The sourced tree defines
# rules AND issuer/realm blocks, and those blocks can reference the SERVER's
# local secrets (file:/env:) and send them to any URL they name. Anyone who can
# push to this repo can therefore rewrite your policy, or exfiltrate host
# secrets by pointing a provider/OAuth client at an endpoint they control.
# Treat push access to this repo as equivalent to access to every secret Talmi
# can read. Require reviews on the tracked branch.
#
# source:
#   github:
#     server: https://github.example.com/     # omit for github.com
#     owner: my-org
#     repo: talmi-config                       # MUST be a trusted, access-controlled repo
#     ref: main
#     app_id: 123456
#     installation_id: 7890123
#     private_key: file:/run/secrets/config-source.pem
#     webhook_secret: env:TALMI_WEBHOOK_SECRET  # enables POST /v2/webhooks/github
#   sync:
#     interval: 8h                              # periodic re-pull

issuers: { include: [ "issuers.d/*.yaml" ] }
realms:  { include: [ "realms.d/*.yaml" ] }
rules:   { include: [ "rules.d/*.yaml" ] }
