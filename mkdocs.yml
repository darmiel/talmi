site_name: Talmi
site_description: A short-lived token service that exchanges verified upstream identities for scoped, auditable downstream tokens.
site_url: ""
repo_url: https://github.com/darmiel/talmi
repo_name: darmiel/talmi
edit_uri: edit/main/docs/

theme:
  name: material
  logo: stylesheets/icon.svg
  favicon: stylesheets/icon.svg
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: black
    accent: white
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer      # prev / next buttons at the bottom
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

          # docs/superpowers holds internal specs/plans, not user documentation.
exclude_docs: |
  superpowers/

nav:
  - Introduction:
      - Overview: index.md
      - Background: introduction/background.md
  - Get started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quick-start.md
      - Testing with a mock OIDC issuer: getting-started/testing-oidc.md
  - How-to guides:
      - Set up a GitHub Actions OIDC issuer: how-to/github-actions-issuer.md
      - Set up a generic OIDC issuer: how-to/oidc-issuer.md
      - Set up a GitHub App provider: how-to/github-app-provider.md
      - Set up an Artifactory provider: how-to/artifactory-provider.md
      - Write and test policy rules: how-to/write-rules.md
      - Enable admin access: how-to/enable-admin-access.md
      - Use a remote config source: how-to/config-source-github.md
      - Configure rate limiting: how-to/rate-limiting.md
      - Run with PostgreSQL: how-to/postgres.md
      - Deploy to Kubernetes: how-to/deploy-kubernetes.md
  - Concepts:
      - How Talmi works: concepts/index.md
      - Issuers and principals: concepts/issuers-and-principals.md
      - Realms and providers: concepts/realms-and-providers.md
      - Resources, actions, rules: concepts/resources-actions-rules.md
      - Conditions: concepts/conditions.md
      - Capabilities and discovery: concepts/capabilities.md
      - Leases and revocation: concepts/leases.md
      - Configuration model and trust: concepts/configuration-model.md
  - Reference:
      - Bootstrap (talmi.yaml): reference/bootstrap.md
      - Issuer types: reference/issuers.md
      - Realm and provider types: reference/realms.md
      - Rules and conditions: reference/rules.md
      - Secrets: reference/secrets.md
      - Config sources: reference/config-sources.md
      - Validation and config vet: reference/validation.md
      - Running the server: reference/server.md
      - CLI: cli.md
      - Audit events: reference/audit-events.md
      - Rate limiting: reference/rate-limiting.md
      - JSON schema: reference/json-schema.md
      - Glossary: reference/glossary.md
  - Security:
      - Overview: security/index.md
      - Config source trust: security/trust-model.md
      - Auditing: security/auditing.md
